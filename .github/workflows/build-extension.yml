name: Build Browser Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Build and package extension
      run: npm run package:browserext
    
    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Verify build output
      run: |
        echo "Checking for build_${{ steps.package-version.outputs.version }}.zip in webstore-zips/"
        ls -la webstore-zips/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: browser-extension-${{ steps.package-version.outputs.version }}
        path: webstore-zips/build_${{ steps.package-version.outputs.version }}.zip
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: webstore-zips/build_${{ steps.package-version.outputs.version }}.zip
        draft: true
        generate_release_notes: true
        name: Release v${{ steps.package-version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

