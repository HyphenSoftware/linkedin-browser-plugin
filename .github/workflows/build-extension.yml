name: Build Browser Extension

on:
  push:
    branches: [ "linkedin-to-api-ts" ]
  workflow_dispatch:

concurrency:
  group: build-extension-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Build and package extension
      run: npm run package:browserext
    
    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Verify build output
      run: |
        echo "Checking for build_${{ steps.package-version.outputs.version }}.zip in webstore-zips/"
        ls -la webstore-zips/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: browser-extension-${{ steps.package-version.outputs.version }}
        path: webstore-zips/build_${{ steps.package-version.outputs.version }}.zip
        retention-days: 90
    
    # A draft has no tag yet: GitHub creates the tag on the target commit when the draft is published.
    - name: Create or update the draft release
      if: github.ref_name == github.event.repository.default_branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: v${{ steps.package-version.outputs.version }}
        ZIP: webstore-zips/build_${{ steps.package-version.outputs.version }}.zip
      run: |
        is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
        case "$is_draft" in
          false)
            echo "::notice::$TAG is already published, bump the version in package.json to draft the next release"
            ;;
          true)
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
            ;;
          *)
            gh release create "$TAG" "$ZIP" --draft --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes
            ;;
        esac

