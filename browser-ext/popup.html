<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>LinkedIn to Airtable</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="fullCenter">
        <span id="accountStatus">Not signed in</span>
        <button id="signInButton" class="mainButton" title="Sign in with your Hyphen Microsoft account">Sign in</button>
        <button id="signOutButton" class="mainButton hidden" title="Sign out of this environment">Sign out</button>
    </div>
    <div class="fullCenter">
        <button id="liToJsonButton" class="mainButton disabled toggle" title="Export profile to JSON Resume">LinkedIn Profile to JSON</button>
        <button id="liToJsonDownloadButton" class="mainButton emojiButton disabled toggle" title="Download JSON Resume Export">💾</button>
        <button id="debugCheckButton" class="mainButton emojiButton">🔄</button>
    </div>
    <div class="fullCenter">
        <button id="liToSubcontractor" class="mainButton disabled toggle" title="Add as Subcontractor">Add as Subcontractor</button>
        <button id="liToSubcontractorAlt" class="mainButton toggle hidden" title="Create new Subcontractor">Create new Subcontractor</button>
    </div>
    <div class="fullCenter">
        <button id="liToContact" class="mainButton disabled toggle" title="Add as Contact">Add as Contact</button>
        <button id="liToContactAlt" class="mainButton toggle hidden" title="Create new Contact">Create new Contact</button>
    </div>
    <div class="fullCenter">
        <div style="display: inline-block; margin: 20px;">
            <div class="loader hidden"></div>
        </div>
        <div class="flex">
            <div class="apiSelectWrapper">
                <label>
                    Environment:
                </label>
                <select id="apiSelect" class="apiSelect toggle">
                    <option value="none">None</option>
                </select>
            </div>
            <div class="langSelectWrapper hidden">
                <label>
                    Export language:
                </label>
                <select id="langSelect" class="langSelect toggle">
                    <option value="en_US">en_US</option>
                </select>
            </div>
            <div class="specSelectWrapper">
                <label>
                    JSONResume version:
                </label>
                <select id="specSelect" class="specSelect toggle">
                    <option value="legacy">Legacy (v0.0.16)</option>
                    <option value="stable" selected>Stable (v1.0.0)</option>
                    <option value="beta">Currently even with stable (v1.0.0)</option>
                </select>
            </div>
        </div>
    </div>
    <div class="fullCenter">
        <span>Version: </span><span id="versionDisplay">{version_string}</span>
    </div>
    <script src="popup.js"></script>
</body>

</html>
